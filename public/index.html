<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; background: #f5f6f8; color: #222; }
  h1 { text-align: center; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: #3b6ef5; color: #fff; cursor: pointer; }
  button.secondary { background: #888; }
  button.danger { background: #d9534f; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; background: #fff; padding: 10px; margin-bottom: 8px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #999; }
  .empty { text-align: center; color: #888; }
  input[type=date] { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  .due { font-size: 12px; color: #666; margin-left: 6px; }
  .overdue { color: #d9534f; font-weight: 600; }
  .filters { display: flex; gap: 6px; margin-bottom: 8px; }
  .filters input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button.active { background: #3b6ef5; }
</style>
</head>
<body>
<h1>Task Manager</h1>
<p style="text-align:center"><a href="/list.html">Show list &rarr;</a></p>
<form id="add-form">
  <input type="text" id="title" placeholder="New task..." required>
  <input type="date" id="due" title="Due date (optional)">
  <button>Add</button>
</form>
<div class="filters">
  <input type="text" id="search" placeholder="Search tasks...">
  <button class="secondary active" data-filter="all">All</button>
  <button class="secondary" data-filter="active">Active</button>
  <button class="secondary" data-filter="done">Completed</button>
</div>
<p style="text-align:right"><button class="secondary" id="clear-done">Clear completed</button></p>
<ul id="list"></ul>

<script>
const API = "/api/tasks";
const list = document.getElementById("list");
const searchBox = document.getElementById("search");
let filter = "all";

searchBox.oninput = () => render();
document.querySelectorAll("[data-filter]").forEach((b) => {
  b.onclick = () => {
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach((x) => x.classList.toggle("active", x === b));
    render();
  };
});

async function api(method, id = "", body) {
  const res = await fetch(`${API}/${id}`, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  return res.status === 204 ? null : res.json();
}

async function render() {
  const all = await api("GET");
  const q = searchBox.value.trim().toLowerCase();
  const tasks = all.filter((t) =>
    t.title.toLowerCase().includes(q) &&
    (filter === "all" || (filter === "done" ? t.done : !t.done)));
  list.innerHTML = "";
  if (!tasks.length)
    list.innerHTML = `<p class="empty">${all.length ? "No matching tasks." : "No tasks yet."}</p>`;
  for (const t of tasks) {
    const li = document.createElement("li");
    if (t.done) li.className = "done";

    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = async () => { await api("PUT", t.id, { done: cb.checked }); render(); };

    const span = document.createElement("span");
    span.textContent = t.title;
    if (t.dueDate) {
      const due = document.createElement("small");
      const overdue = !t.done && t.dueDate < new Date().toLocaleDateString("en-CA");
      due.className = "due" + (overdue ? " overdue" : "");
      due.textContent = (overdue ? "Overdue: " : "Due: ") + t.dueDate;
      span.appendChild(due);
    }

    const edit = document.createElement("button");
    edit.textContent = "Edit"; edit.className = "secondary";
    edit.onclick = async () => {
      const title = prompt("Edit task", t.title);
      if (title === null) return;
      const dueDate = prompt("Due date (YYYY-MM-DD, blank to clear)", t.dueDate || "");
      const body = { title };
      if (dueDate !== null) body.dueDate = dueDate.trim();
      try { await api("PUT", t.id, body); render(); } catch (e) { alert(e.message); }
    };

    const del = document.createElement("button");
    del.textContent = "Delete"; del.className = "danger";
    del.onclick = async () => { await api("DELETE", t.id); render(); };

    li.append(cb, span, edit, del);
    list.appendChild(li);
  }
}

document.getElementById("add-form").onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById("title");
  const due = document.getElementById("due");
  try { await api("POST", "", { title: input.value, dueDate: due.value }); input.value = ""; due.value = ""; render(); }
  catch (err) { alert(err.message); }
};

document.getElementById("clear-done").onclick = async () => {
  try { await api("DELETE"); render(); } catch (err) { alert(err.message); }
};

render();
</script>
</body>
</html>
